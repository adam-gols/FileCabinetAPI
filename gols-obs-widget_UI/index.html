<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOLS UI Widget</title>
  
  <!-- External Dependencies -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Widget Styles -->
  <link rel="stylesheet" href="src/styles/main.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/game-info.css">
  <link rel="stylesheet" href="src/styles/compact.css">
  <link rel="stylesheet" href="src/styles/file-cabinet.css">
  
  <style>
    /*
      OBS auto-scale stage:
      - OBS Browser Source size is the "viewport".
      - We render the widget at a fixed design size and scale to fit.

      Adjust these two values to match your intended base design.
    */
    :root {
      --gols-design-width: 450;
      --gols-design-height: 380;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    /* The outer stage matches the Browser Source size */
    #widget-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      transform: translateZ(0);
    }

    /* This wrapper is what gets scaled */
    #widget-scale {
      position: absolute;
      left: 0;
      top: 0;
      width: calc(var(--gols-design-width) * 1px);
      height: calc(var(--gols-design-height) * 1px);
      transform-origin: top left;
    }

    /* The design canvas is the fixed-size "artboard" */
    #widget-canvas {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: transparent;
    }

    /* Container styles for widget embedding */
    body {
      margin: 0;
      padding: 20px;
      background-color: #f0f0f0;
      font-family: 'Roboto', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    
    #widget-container {
      width: 450px;
      height: 380px;
      position: relative;
      overflow: hidden;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div id="widget-stage">
    <div id="widget-scale">
      <div id="widget-canvas">
        <div id="gols-widget">
          <!-- Widget content will be populated by JavaScript -->
          <div class="gols-loading">
            <i class="fas fa-spinner fa-spin"></i>
            <span>Loading GOLS Widget...</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Widget JavaScript -->
  <script src="src/js/file-cabinet-api.js"></script>
  <script src="src/js/obs-websocket.js"></script>
  <script src="src/js/mock-services.js"></script>
  <script src="src/js/demo-data.js"></script>
  <script src="src/js/ui-manager.js"></script>
  <script src="src/js/main.js"></script>

  <script>
    (function () {
      const stage = document.getElementById('widget-stage');
      const scaleEl = document.getElementById('widget-scale');

      const getDesignSize = () => {
        const styles = getComputedStyle(document.documentElement);
        const w = parseFloat(styles.getPropertyValue('--gols-design-width')) || 450;
        const h = parseFloat(styles.getPropertyValue('--gols-design-height')) || 380;
        return { w, h };
      };

      const applyScale = () => {
        const { w, h } = getDesignSize();
        const rect = stage.getBoundingClientRect();
        const scale = Math.min(rect.width / w, rect.height / h) || 1;

        // Center inside the stage
        const left = Math.max(0, (rect.width - w * scale) / 2);
        const top = Math.max(0, (rect.height - h * scale) / 2);

        scaleEl.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
      };

      // ResizeObserver is ideal in OBS/browser source environments.
      if ('ResizeObserver' in window) {
        const ro = new ResizeObserver(applyScale);
        ro.observe(stage);
      }

      window.addEventListener('resize', applyScale);
      window.addEventListener('load', applyScale);
      applyScale();
    })();
  </script>
</body>
</html>
